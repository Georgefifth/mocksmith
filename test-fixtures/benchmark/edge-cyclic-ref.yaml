openapi: 3.0.0
info:
  title: Cyclic Schema API
  version: 1.0.0
paths:
  /api/v1/employees:
    get:
      summary: List employees
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
    post:
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '201':
          description: Created
components:
  schemas:
    Employee:
      type: object
      required:
        - name
        - role
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        manager:
          $ref: '#/components/schemas/Employee'
