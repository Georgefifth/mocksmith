openapi: 3.0.3
info:
  title: Swagger Petstore - MockSmith Sample
  version: 1.0.0
  description: Sample petstore API for testing stateful mock endpoints and latency injection.
paths:
  /pets:
    get:
      summary: List all pets
      responses:
        '200':
          description: A paged array of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      summary: Create a pet
      responses:
        '201':
          description: Null response
  /pets/{id}:
    get:
      summary: Info for a specific pet
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    put:
      summary: Update a pet
    delete:
      summary: Delete a pet
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        tag:
          type: string
        status:
          type: string
          enum: [available, pending, adopted]
        price:
          type: number
